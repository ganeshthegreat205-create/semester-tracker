<title>Study Command Center</title>

<style>

:root[data-theme="dark"]{--bg:#0b0f1a;--card:#141a2b;--tx:#e8ecf6;--mu:#8b95b0;--ln:#232c45;--ac:#8493ff;--ok:#34d399;--wa:#fbbf24;--bad:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:22px 0 10px}
p{margin:0}small,.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--ac),#9b5cff);color:#fff;border:0}
.hero small{color:#ffffffcc}.hero b{font-size:26px;display:block;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px}
.stat b{font-size:20px;display:block}.stat small{font-size:12px}
.pace{border-left:5px solid var(--ok)}.pace.warn{border-color:var(--wa)}.pace.bad{border-color:var(--bad)}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;border-radius:9px}
.sj{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;color:#fff;white-space:nowrap}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.row .m{flex:1;min-width:0}.row .m b{font-size:14px}.row .m small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .h{text-align:right;font-size:13px;white-space:nowrap}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--ln);background:none;color:#fff;font-size:15px;flex:none;padding:0}
.chk.Completed{background:var(--ok);border-color:var(--ok)}.chk.In-progress{border-color:var(--wa)}.chk.Deferred{border-color:var(--bad)}
.late{color:var(--bad)}.dh{font-size:12px;font-weight:700;color:var(--mu);margin:14px 2px 6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}.chip,.seg button{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;white-space:nowrap}
.chip.on,.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.seg{display:flex;gap:8px;margin-bottom:10px}.seg button{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:11px;padding:6px 0}nav button.on{color:var(--ac);font-weight:700}nav span{display:block;font-size:20px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:600;background:var(--ac);color:#fff;margin-top:10px}.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
#sh{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:20}#sh[hidden]{display:none}
.sc{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.hd button{background:none;border:0;color:var(--ac);font:inherit;font-weight:700}
.sc p{color:var(--mu);margin-bottom:12px}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
label{display:block;font-size:12px;color:var(--mu);margin-top:8px}input,textarea{width:100%;margin-top:4px;padding:11px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
#t{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;z-index:30}
svg text{fill:var(--mu);font-size:9px}

 const C=2*Math.PI*42;
 return `<h1>Study Command Center</h1><small>${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</small><div style="height:12px"></div>
 <div class="card hero"><svg width="104" height="104" viewBox="0 0 104 104"><circle cx="52" cy="52" r="42" fill="none" stroke="#fff4" stroke-width="10"/><circle cx="52" cy="52" r="42" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}" transform="rotate(-90 52 52)"/><text x="52" y="58" text-anchor="middle" style="fill:#fff;font-size:22px;font-weight:700">${pct}%</text></svg>
 <div><small>Syllabus sessions done</small><b>${sd} / ${T}</b><small>${nx?`Next exam: ${nx.k} in ${days(nx.exam)} days`:'All exams done'}</small></div></div>
 <div class="card pace ${cls}"><b>${bh.toFixed(1)} h behind</b><p class="mu">${aF.toFixed(1)} h logged vs ${pl.toFixed(1)} h planned by today. ${msg}</p></div>
 <div class="grid"><div class="stat"><b>${aF.toFixed(1)}</b><small>hours logged</small></div><div class="stat"><b>${(T-sd)}</b><small>sessions left</small></div><div class="stat"><b>${left.toFixed(0)}</b><small>first-time h left</small></div></div>
 <h2>Pace chart</h2><div class="card">${chart()}</div>
 <h2>Due or overdue (${late.length})</h2>${late.slice(0,6).map(o=>row('f',o.i)).join('')||'<p class="mu">Nothing overdue.</p>'}${late.length>6?`<button class="btn g" data-a="tab" data-v="tasks">See all ${late.length}</button>`:''}
 <h2>Subjects</h2>${D.subjects.map(s=>{const d=s.before+S.f.filter(x=>x.subj===s.k&&x.status==='Completed').length,p=Math.round(d/s.total*100),rv=S.r.filter(x=>x.subj===s.k),rd=sum(rv.filter(x=>x.status==='Completed'),'planned'),rp=sum(rv,'planned');
 return `<div class="card"><div class="sj"><b>${tag(s.k)} ${esc(s.name)}</b><small>${days(s.exam)}d</small></div><div class="bar"><i style="width:${p}%;background:${s.color}"></i></div><small>${d}/${s.total} sessions · ${p}% · revision ${rd.toFixed(1)}/${rp.toFixed(1)} h</small></div>`}).join('')}`}
function chart(){
 const ds=[...new Set(S.f.map(x=>x.date))].sort();let p=0,a=0;
 const pts=ds.map(d=>{const r=S.f.filter(x=>x.date===d);p+=sum(r,'planned');a+=sum(r,'actual');return{d,p,a}});
 const W=320,H=130,mx=p||1,X=i=>20+i*(W-30)/Math.max(1,pts.length-1),Y=v=>H-18-v/mx*(H-30);
 const L=k=>pts.map((q,i)=>`${X(i)},${Y(q[k])}`).join(' '),ti=pts.findIndex(q=>q.d>=TODAY);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline points="${L('p')}" fill="none" stroke="var(--mu)" stroke-width="2" stroke-dasharray="4 3"/><polyline points="${L('a')}" fill="none" stroke="var(--ac)" stroke-width="3" stroke-linecap="round"/>${ti>=0?`<line x1="${X(ti)}" x2="${X(ti)}" y1="8" y2="${H-18}" stroke="var(--wa)"/><text x="${X(ti)}" y="${H-6}" text-anchor="middle">today</text>`:''}<text x="20" y="${H-6}">${fmt(pts[0].d)}</text><text x="${W-10}" y="${H-6}" text-anchor="end">${fmt(pts.at(-1).d)}</text><text x="20" y="10">${mx.toFixed(0)} h</text></svg><small>Dashed: planned cumulative hours. Solid: your logged hours.</small>`}
function row(k,i){
 const x=S[k][i],c=x.status.replace(' ','-'),ov=x.date<TODAY&&x.status!=='Completed'&&x.status!=='Deferred';
 return `<div class="row" data-a="open" data-k="${k}" data-i="${i}"><button class="chk ${c}" data-a="chk" data-k="${k}" data-i="${i}">${x.status==='Completed'?'✓':''}</button><div class="m"><b>${tag(x.subj)} ${esc(k==='f'?x.item:x.mode)} <span class="${ov?'late':'mu'}" style="font-weight:400;font-size:12px">${fmt(x.date)}${ov?' · overdue':''}</span></b><small>${esc(k==='f'?x.topic:x.task)}</small></div><div class="h">${x.planned}h${x.actual!==''?`<br><small>${x.actual} done</small>`:''}</div></div>`}
function tasks(){
 const L=S[kind].map((x,i)=>({x,i})).filter(o=>(fs==='all'||o.x.subj===fs)&&(fst==='all'||o.x.status===fst));
 let h=`<h1>Tasks</h1><div class="seg"><button data-a="kind" data-v="f" class="${kind==='f'?'on':''}">First-time</button><button data-a="kind" data-v="r" class="${kind==='r'?'on':''}">Revision</button></div>
 <div class="chips">${['all',...D.subjects.map(s=>s.k)].map(s=>`<button class="chip ${fs===s?'on':''}" data-a="fs" data-v="${s}">${s==='all'?'All subjects':s}</button>`).join('')}</div>
 <div class="chips">${['all',...ST].map(s=>`<button class="chip ${fst===s?'on':''}" data-a="fst" data-v="${s}">${s==='all'?'Any status':s}</button>`).join('')}</div>`;
 let last='';for(const o of L){if(o.x.date!==last){last=o.x.date;h+=`<div class="dh">${dow(last)} ${fmt(last)}${last===TODAY?' · TODAY':''}</div>`}h+=row(kind,o.i)}
 return h+(L.length?'':'<p class="mu">No items match.</p>')}
function exams(){
 return `<h1>Exams</h1><small>All papers 2 PM to 5 PM</small><div style="height:12px"></div>`+D.subjects.slice().sort((a,b)=>a.exam<b.exam?-1:1).map(s=>{const d=days(s.exam);return `<div class="card sj"><div><b>${tag(s.k)} ${esc(s.name)}</b><br><small>${dow(s.exam)} ${fmt(s.exam)}</small></div><div style="text-align:right"><b style="font-size:24px">${d<0?'Done':d}</b><br><small>${d<0?'':'days'}</small></div></div>`}).join('')+
 `<h2>Deferral rule</h2><div class="card"><p class="mu">Use only if more than 4 h behind at a checkpoint (11, 15, 19, 23, 25 Nov). Defer in this order:</p><ol class="mu"><li>DM S14 and S15</li><li>IS S9 and S10</li><li>DSC S13</li><li>CAIT Section A drills S12 to S15</li></ol><p class="mu">Deferred items stay first-time work, done from 26 Nov. Never stretch a day past 6 h.</p></div>`}
function data(){
 return `<h1>Excel sync</h1><div class="card"><p>Your progress saves automatically in this browser. Use Excel as the master copy.</p><button class="btn" data-a="exp">Download updated .xlsx</button><button class="btn g" data-a="imp">Load progress from .xlsx</button><button class="btn g" data-a="reset">Reset to original plan</button></div>
 <p class="mu">Browser storage is per device. To move between phone and laptop: export here, then import on the other device. Live two-way Google Sheets sync needs a server and sign-in, which a standalone page cannot do.</p>`}
function sheet(){
 const el=$('#sh');if(!cur){el.hidden=true;return}
 const x=S[cur.k][cur.i],f=cur.k==='f';el.hidden=false;
 el.innerHTML=`<div class="sc"><div class="hd"><b>${esc(x.subj)} · ${esc(f?x.item:x.mode)} · ${x.planned}h planned</b><button data-a="close">Done</button></div><p>${esc(f?x.topic:x.task)}</p><div class="chips" style="flex-wrap:wrap">${ST.map(t=>`<button class="chip ${x.status===t?'on':''}" data-a="status" data-v="${t}">${t}</button>`).join('')}</div><div class="g"><label>Actual (h)<input id="ia" type="number" inputmode="decimal" step=".25" min="0" value="${x.actual}"></label>${f?`<label>Questions done<input id="iq" type="number" inputmode="numeric" min="0" value="${x.q}"></label>`:'<span></span>'}</div><label>Notes / blockers<textarea id="in" rows="3">${esc(x.notes)}</textarea></label></div>`}
function render(){$('#v').innerHTML={home,tasks,exams,data}[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab||b.dataset.v===tab))}
function exp(){
 const sr=s=>Math.round(Date.parse(s+'T00:00Z')/864e5)+25569,dc=s=>({v:sr(s),t:'n',z:'d mmm yyyy'});
 const F=[['Date','Day','Subject','Item','Type','Planned (h)','Topic / task','Priority','Syllabus-only topics in this item','Status','Actual (h)','Questions done','Notes / blockers'],...S.f.map(x=>[dc(x.date),dow(x.date),x.subj,x.item,x.type,x.planned,x.topic,x.prio,x.gaps,x.status,x.actual,x.q,x.notes])];
 const R=[['Date','Day','Day type','Subject','Planned (h)','Mode','Task','Status','Actual (h)','Notes / blockers'],...S.r.map(x=>[dc(x.date),dow(x.date),x.daytype,x.subj,x.planned,x.mode,x.task,x.status,x.actual,x.notes])];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(F),'First-time');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(R),'Revision');
 XLSX.writeFile(wb,'Semester_Study_Tracker_updated_'+TODAY+'.xlsx');toast('Downloaded')}
async function imp(file){
 try{const wb=XLSX.read(await file.arrayBuffer()),dt=n=>new Date(Math.round((n-25569)*864e5)).toISOString().slice(0,10),e=v=>v===''||v==null?'':num(v);
 const rows=n=>{const ws=wb.Sheets[n];if(!ws)return null;const a=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});const h=a.findIndex(r=>r[0]==='Date');return a.slice(h+1).filter(r=>typeof r[0]==='number')};
 const F=rows('First-time'),R=rows('Revision');if(!F||!R)return toast('Sheets First-time and Revision not found');
 S.f=F.map(r=>({date:dt(r[0]),subj:r[2],item:r[3],type:r[4],planned:num(r[5]),topic:r[6],prio:r[7],gaps:r[8],status:r[9]||'Not started',actual:e(r[10]),q:e(r[11]),notes:r[12]||''}));
 S.r=R.map(r=>({date:dt(r[0]),daytype:r[2],subj:r[3],planned:num(r[4]),mode:r[5],task:r[6],status:r[7]||'Not started',actual:e(r[8]),notes:r[9]||''}));
 save();render();toast('Loaded '+S.f.length+' + '+S.r.length+' rows')}catch(x){toast('Could not read that file')}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v,k=t.dataset.k,i=+t.dataset.i;
 if(a==='tab'){tab=v;render();scrollTo(0,0)}
 else if(a==='kind'){kind=v;render()}else if(a==='fs'){fs=v;render()}else if(a==='fst'){fst=v;render()}
 else if(a==='chk'){const x=S[k][i];x.status=x.status==='Completed'?'Not started':'Completed';save();render()}
 else if(a==='open'){cur={k,i};sheet()}
 else if(a==='close'){cur=null;sheet();render()}
 else if(a==='status'){S[cur.k][cur.i].status=v;save();sheet();render()}
 else if(a==='exp')exp();else if(a==='imp')$('#fi').click();
 else if(a==='reset'&&confirm('Discard all your progress and reload the original plan?')){S={f:D.f,r:D.r};save();render();toast('Reset')}});
$('#sh').addEventListener('click',e=>{if(e.target.id==='sh'){cur=null;sheet();render()}});
$('#sh').addEventListener('input',e=>{const x=S[cur.k][cur.i],id=e.target.id;if(id==='ia')x.actual=e.target.value===''?'':+e.target.value;else if(id==='iq')x.q=e.target.value===''?'':+e.target.value;else if(id==='in')x.notes=e.target.value;save();render()});
$('#fi').addEventListener('change',e=>{if(e.target.files[0])imp(e.target.files[0]);e.target.value=''});
render();
</script></body></html>
