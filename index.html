.in{background:var(--card2);border-radius:16px;padding:14px;min-width:0}

.top .logo{background:#fff3}
.tg{width:44px;height:44px;border-radius:14px;border:0;background:var(--card);color:var(--tx);display:grid;place-items:center;box-shadow:var(--sh)}

.xc b.n{font-size:34px;letter-spacing:-.03em;display:block;line-height:1}

.seg{display:flex;gap:8px;margin:12px 0}.seg button{flex:1}

.bv{position:absolute;bottom:0;left:0;right:0;border-radius:10px;border:1.5px solid var(--ac);background:repeating-linear-gradient(135deg,var(--ac) 0 3px,transparent 3px 7px)}
.bn{position:absolute;left:-6px;right:-6px;text-align:center;font-size:10px;color:var(--mu)}.bc small{font-size:11px}

.big{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}

 <section class="card" style="grid-column:span 6"><h3 class="ct">Upcoming examinations</h3><div class="ex">${n3.map(s=>`<div class="in xc" style="--c:${s.color}">${tag(s.k)}<p style="margin:10px 0 4px"><b>${esc(s.name)}</b></p><b class="n">${days(s.exam)}<small style="font-size:13px;font-weight:400"> days</small></b><small>${dow(s.exam)} ${fmt(s.exam)} · 2 to 5 PM</small></div>`).join('')}</div></section>
 <section class="card" style="grid-column:span 6"><h3 class="ct">Subjects</h3><div class="sg">${D.subjects.map(s=>{const d=s.before+f.filter(x=>x.subj===s.k&&x.status==='Completed').length,p=Math.round(d/s.total*100),rv=r.filter(x=>x.subj===s.k),rq=sum(rv,'planned'),rc=sum(rv.filter(x=>x.status==='Completed'),'planned');
 return `<div class="in sc2" style="--c:${s.color}" data-a="subj" data-v="${s.k}"><div class="sj">${tag(s.k)}<b style="font-size:22px">${p}%</b></div><p style="margin-top:8px"><b>${esc(s.name)}</b></p><div class="bar"><i style="width:${p}%"></i></div><small>${d} of ${s.total} sessions · ${s.total-d} left</small><br><small>Revision ${rq?Math.round(rc/rq*100):0}% (${rc.toFixed(1)}/${rq.toFixed(1)} h)</small><br><small>Exam ${dow(s.exam)} ${fmt(s.exam)} · ${days(s.exam)} days</small></div>`}).join('')}</div></section></div>`}
function row(k,i){
 const x=S[k][i],c=x.status.replace(' ','-'),ov=x.date<TODAY&&x.status!=='Completed'&&x.status!=='Deferred',f=k==='f';
 return `<div class="row" style="--c:${sub(x.subj).color}" data-a="open" data-k="${k}" data-i="${i}"><button class="chk ${c}" aria-label="Mark complete" data-a="chk" data-k="${k}" data-i="${i}">${ic('check')}</button><div class="m"><b>${esc(x.subj)} · ${esc(f?x.item:x.mode)} ${f&&x.prio?`<em>${esc(x.prio)}</em>`:''} <small style="font-weight:400">${fmt(x.date)}</small></b><small>${esc(f?x.topic:x.task)}</small></div><div class="h"><span class="pl ${ov?'Deferred':c}">${ov?'Overdue':x.status}</span><small>${x.planned}h${x.actual!==''?' · '+x.actual+' done':''}</small></div></div>`}
function tasks(){
 const L=S[kind].map((x,i)=>({x,i})).filter(o=>(fs==='all'||o.x.subj===fs)&&(fst==='all'||o.x.status===fst));
 let h=`<div class="card"><h1>Tasks</h1><div class="seg"><button data-a="kind" data-v="f" class="${kind==='f'?'on':''}">First-time (${S.f.length})</button><button data-a="kind" data-v="r" class="${kind==='r'?'on':''}">Revision (${S.r.length})</button></div>
 <div class="chips">${['all',...D.subjects.map(s=>s.k)].map(s=>`<button class="chip ${fs===s?'on':''}" data-a="fs" data-v="${s}">${s==='all'?'All subjects':s}</button>`).join('')}</div>
 <div class="chips">${['all',...ST].map(s=>`<button class="chip ${fst===s?'on':''}" data-a="fst" data-v="${s}">${s==='all'?'Any status':s}</button>`).join('')}</div>`;
 let last='';for(const o of L){if(o.x.date!==last){last=o.x.date;h+=`<div class="dh">${dow(last)} ${fmt(last)}${last===TODAY?' <span>· TODAY</span>':''}</div>`}h+=row(kind,o.i)}
 return h+(L.length?'':'<p class="mu">No items match.</p>')+'</div>'}
function exams(){
 const l=D.subjects.slice().sort((a,b)=>a.exam<b.exam?-1:1),nx=l.findIndex(s=>days(s.exam)>=0);
 return `<div class="card"><h1>Examinations</h1><small>All papers 2 PM to 5 PM</small><div style="height:14px"></div><div class="tl">`+l.map((s,i)=>{const d=days(s.exam);return `<div class="in sj" style="--c:${s.color}"><span class="nb">${i+1}</span><div><b>${tag(s.k)} ${esc(s.name)}</b>${i===nx?' <span class="pl In-progress">Next</span>':''}<br><small>${dow(s.exam)} ${fmt(s.exam)} 2026</small></div><div style="text-align:right"><b style="font-size:26px;letter-spacing:-.02em">${d<0?'Done':d}</b><br><small>${d<0?'':'days left'}</small></div></div>`}).join('')+`</div>
 </div><div class="card" style="margin-top:14px"><h3 class="ct">Deferral rule</h3><div><p class="mu">Use only if more than 4 h behind at a checkpoint (11, 15, 19, 23, 25 Nov). Defer in this order:</p><ol class="mu"><li>DM S14 and S15</li><li>IS S9 and S10</li><li>DSC S13</li><li>CAIT Section A drills S12 to S15</li></ol><p class="mu">Deferred items stay first-time work, done from 26 Nov. Never stretch a day past 6 h.</p></div>`}
function data(){
 return `<div class="card"><h1>Excel sync</h1><p style="margin-top:8px">Progress saves automatically in this browser. Treat the Excel file as your master copy.</p><button class="btn" data-a="exp">${ic('xl')} Download updated .xlsx</button><button class="btn g" data-a="imp">${ic('up')} Load progress from .xlsx</button><button class="btn g" data-a="reset">${ic('rs')} Reset to original plan</button>
 <p class="mu" style="margin-top:12px">Storage is per device. To move between devices, export here and import on the other one. The export holds the First-time and Revision sheets; keep your original workbook for the formula sheets.</p></div>`}
function sheet(){
 const el=$('#sh');if(!cur){el.hidden=true;return}
 const x=S[cur.k][cur.i],f=cur.k==='f';el.hidden=false;
 el.innerHTML=`<div class="sx"><div class="hd"><b>${tag(x.subj)} ${esc(f?x.item:x.mode)} · ${x.planned}h planned</b><button data-a="close">Done</button></div><p>${esc(f?x.topic:x.task)}</p>${f?`<small>Priority ${esc(x.prio)} · Syllabus gaps: ${esc(x.gaps)}</small>`:''}<div class="chips" style="flex-wrap:wrap;margin-top:10px">${ST.map(t=>`<button class="chip ${x.status===t?'on':''}" data-a="status" data-v="${t}">${t}</button>`).join('')}</div><div class="g"><label>Actual (h)<input id="ia" type="number" inputmode="decimal" step=".25" min="0" value="${x.actual}"></label>${f?`<label>Questions done<input id="iq" type="number" inputmode="numeric" min="0" value="${x.q}"></label>`:'<span></span>'}</div><label>Notes / blockers<textarea id="in" rows="3">${esc(x.notes)}</textarea></label></div>`}
function render(){$('#v').innerHTML={home,tasks,exams,data}[tab]();document.querySelectorAll('nav .nb2[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===tab))}
function exp(){
 const sr=s=>Math.round(Date.parse(s+'T00:00Z')/864e5)+25569,dc=s=>({v:sr(s),t:'n',z:'d mmm yyyy'});
 const F=[['Date','Day','Subject','Item','Type','Planned (h)','Topic / task','Priority','Syllabus-only topics in this item','Status','Actual (h)','Questions done','Notes / blockers'],...S.f.map(x=>[dc(x.date),dow(x.date),x.subj,x.item,x.type,x.planned,x.topic,x.prio,x.gaps,x.status,x.actual,x.q,x.notes])];
 const R=[['Date','Day','Day type','Subject','Planned (h)','Mode','Task','Status','Actual (h)','Notes / blockers'],...S.r.map(x=>[dc(x.date),dow(x.date),x.daytype,x.subj,x.planned,x.mode,x.task,x.status,x.actual,x.notes])];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(F),'First-time');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(R),'Revision');
 XLSX.writeFile(wb,'Semester_Study_Tracker_updated_'+TODAY+'.xlsx');toast('Downloaded')}
async function imp(file){
 try{const wb=XLSX.read(await file.arrayBuffer()),dt=n=>new Date(Math.round((n-25569)*864e5)).toISOString().slice(0,10),e=v=>v===''||v==null?'':num(v);
 const rows=n=>{const ws=wb.Sheets[n];if(!ws)return null;const a=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});const h=a.findIndex(r=>r[0]==='Date');return a.slice(h+1).filter(r=>typeof r[0]==='number')};
 const F=rows('First-time'),R=rows('Revision');if(!F||!R)return toast('Sheets First-time and Revision not found');
 S.f=F.map(r=>({date:dt(r[0]),subj:r[2],item:r[3],type:r[4],planned:num(r[5]),topic:r[6],prio:r[7],gaps:r[8],status:r[9]||'Not started',actual:e(r[10]),q:e(r[11]),notes:r[12]||''}));
 S.r=R.map(r=>({date:dt(r[0]),daytype:r[2],subj:r[3],planned:num(r[4]),mode:r[5],task:r[6],status:r[7]||'Not started',actual:e(r[8]),notes:r[9]||''}));
 save();render();toast('Loaded '+S.f.length+' + '+S.r.length+' rows')}catch(x){toast('Could not read that file')}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v,k=t.dataset.k,i=+t.dataset.i;
 if(a==='tab'){tab=v;render();scrollTo(0,0)}
 else if(a==='theme')theme(v);
 else if(a==='subj'){tab='tasks';kind='f';fs=v;fst='all';render();scrollTo(0,0)}
 else if(a==='kind'){kind=v;render()}else if(a==='fs'){fs=v;render()}else if(a==='fst'){fst=v;render()}
 else if(a==='chk'){const x=S[k][i];x.status=x.status==='Completed'?'Not started':'Completed';save();render()}
 else if(a==='open'){cur={k,i};sheet()}
 else if(a==='close'){cur=null;sheet();render()}
 else if(a==='status'){S[cur.k][cur.i].status=v;save();sheet();render()}
 else if(a==='exp')exp();else if(a==='imp')$('#fi').click();
 else if(a==='reset'&&confirm('Discard all your progress and reload the original plan?')){S={f:D.f,r:D.r};save();render();toast('Reset')}});
$('#sh').addEventListener('click',e=>{if(e.target.id==='sh'){cur=null;sheet();render()}});
$('#sh').addEventListener('input',e=>{const x=S[cur.k][cur.i],id=e.target.id;if(id==='ia')x.actual=e.target.value===''?'':+e.target.value;else if(id==='iq')x.q=e.target.value===''?'':+e.target.value;else if(id==='in')x.notes=e.target.value;save();render()});
$('#fi').addEventListener('change',e=>{if(e.target.files[0])imp(e.target.files[0]);e.target.value=''});
theme(document.documentElement.dataset.theme);
render();
</script></body></html>
